name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-entrega:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar estrutura, notebook e links
        run: python scripts/validar_entrega.py

      - name: Testar Parte 1
        run: python -B -X utf8 src/parte1/test_diagnostico_sintomas.py

      - name: Testar Parte 2
        run: python -B -X utf8 src/parte2/test_classificador_risco.py

      - name: Conferir dependências
        run: python -m pip check
